
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de Productos - Cafetería</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Gestión de Productos</h1>
        <p>Consulta de productos de nuestra cafetería</p>
    </header>

    <main>
        <section class="panel">
            <h2>Lista de productos</h2>
            <p id="mensaje">Cargando productos...</p>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-datos"></tbody>
                </table>
            </div>
        </section>

        <section class="panel">
            <h2>Gráfica de precios</h2>
            <canvas id="miGrafica"></canvas>
        </section>
    </main>

    <footer>
        <p>Práctica 3 - Unidad 2 | API REST con Node.js y Chart.js</p>
    </footer>
</body>
</html>
